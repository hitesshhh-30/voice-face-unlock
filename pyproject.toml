[project]
name = "voice-face-unlock"
version = "0.1.0"
description = "Unlock your GNOME lock screen with a voice phrase + live face + blink check. Fully offline."
requires-python = ">=3.10"
dependencies = [
  "vosk>=0.3.45",
  "sherpa-onnx>=1.10",
  "opencv-python-headless>=4.8",
  "mediapipe>=0.10.14",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
voice-face-unlock = "voice_face_unlock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_face_unlock"]
